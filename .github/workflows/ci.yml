name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Contract, upstream HTTP, transport and executable tests
        run: go test -race -cover ./...
      - name: Static checks
        run: go vet ./...
      - name: Build production executable
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/bedolaga-mcp ./cmd/bedolaga-mcp
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: bedolaga-mcp:test
          cache-from: type=gha,scope=bedolaga-mcp
          cache-to: type=gha,scope=bedolaga-mcp,mode=max



  build-and-push:
    needs: smoke
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Read package version
        id: version
        run: |
          VER=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/bedolaga/config.go)
          echo "tag=$VER" >> "$GITHUB_OUTPUT"
      - name: Build and push (latest + version + immutable commit tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha,scope=bedolaga-mcp
          cache-to: type=gha,scope=bedolaga-mcp,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bedolaga-mcp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bedolaga-mcp:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bedolaga-mcp:${{ github.sha }}
