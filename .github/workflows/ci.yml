name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  smoke:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module and formatting consistency
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
          test -z "$(gofmt -l cmd internal)"
      - name: Go lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Mock upstream HTTP and in-process transport race tests
        run: go test -race -vet=off -count=1 -cover ./...
      - name: Static checks
        run: go vet ./...
      - name: Build production executable
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/bedolaga-mcp ./cmd/bedolaga-mcp
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: bedolaga-mcp:test
          cache-from: type=gha,scope=bedolaga-mcp
          cache-to: type=gha,scope=bedolaga-mcp,mode=max



  build-and-push:
    needs: smoke
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: bedolaga-mcp-publication
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Read package version
        id: version
        run: |
          VER=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/bedolaga/config.go)
          echo "tag=$VER" >> "$GITHUB_OUTPUT"
      - name: Build and push (latest + version + immutable commit tag)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=bedolaga-mcp
          cache-to: type=gha,scope=bedolaga-mcp,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bedolaga-mcp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bedolaga-mcp:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bedolaga-mcp:${{ github.sha }}
